reset_learning:
  target:
    entity:
      integration: heatpump_pid
      domain: climate
resume:
  target:
    entity:
      integration: heatpump_pid
      domain: climate
set_tuning:
  target:
    entity:
      integration: heatpump_pid
      domain: climate
  fields:
    mode:
      selector:
        select:
          options: ["heat", "cool"]
    kp:
      selector:
        number: {min: 0, max: 10, step: 0.05, mode: box}
    ki:
      selector:
        number: {min: 0, max: 10, step: 0.05, mode: box}
    kd:
      selector:
        number: {min: 0, max: 10, step: 0.05, mode: box}
    kff:
      selector:
        number: {min: 0, max: 1, step: 0.01, mode: box}
start_autotune:
  target:
    entity:
      integration: heatpump_pid
      domain: climate
  fields:
    step_size:
      selector:
        number: {min: 0.5, max: 4, step: 0.5, mode: box}
    aggressiveness:
      selector:
        number: {min: 0.5, max: 3, step: 0.1, mode: box}
cancel_autotune:
  target:
    entity:
      integration: heatpump_pid
      domain: climate
